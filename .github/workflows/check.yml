name: check
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: check, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - run: |
          git config user.name status-bot; git config user.email status-bot@users.noreply.github.com
          git add data; git commit -m "status $(date -u +%FT%TZ)" -q || exit 0
          git pull --rebase -q && git push -q
